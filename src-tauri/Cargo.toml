[package]
name = "local-ai-performance-monitor"
version = "0.1.0"
edition = "2021"

[lib]
name = "model_monitor"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
nvml-wrapper = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
futures-util = "0.3"
url = "2"


[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.18"

[dependencies.chrono]
version = "0.4"

[dependencies.libloading]
version = "0.8"

[dependencies.rfd]
version = "0.15"
